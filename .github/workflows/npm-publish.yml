name: Publish npm package

on:
  workflow_run:
    workflows: [Publish release, Publish scheduled releases]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing public release tag to publish or verify
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-publish
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@12.2.2
      - name: Verify and publish the original release archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/publish-npm.mjs
