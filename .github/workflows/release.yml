name: Publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-publish
  queue: max
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Verify release version
        run: npm run release:check
      - run: npm ci
      - run: npm run check
      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs

  dispatch-npm:
    needs: release
    if: github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch npm publication for the public tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [[ "$draft" == false ]]; then
            gh workflow run npm-publish.yml --repo "$GITHUB_REPOSITORY" --ref main -f "tag=$GITHUB_REF_NAME"
          fi
